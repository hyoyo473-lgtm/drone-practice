# NAS 上只需要這個檔案 + .env，不用下載整份程式碼
# 映像檔由 GitHub Actions 自動打包（見 .github/workflows/docker-publish.yml）
services:
  drone-practice:
    image: ghcr.io/hyoyo473-lgtm/drone-practice:latest
    container_name: drone-practice
    restart: unless-stopped
    environment:
      - ADMIN_PIN=${ADMIN_PIN:?請先建立 .env 並設定 ADMIN_PIN}
      - TZ=Asia/Taipei
    volumes:
      - ./data:/data          # 資料庫存在這裡，記得納入 NAS 備份
    ports:
      - "${PORT:-8080}:8080"  # 校內可用 http://NAS的IP:PORT 連線
