# 每次推送到 main：先自動檢查程式，通過後打包成 Docker 映像檔，放到 GitHub (ghcr.io)
# 其他人發 Pull Request 時：只做檢查，不會打包發布
# 這個流程不需要、也不會碰到任何 NAS 的位址或密碼
name: 檢查並打包 Docker 映像檔

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:     # 可以在 GitHub 的 Actions 頁面手動執行

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 檢查 Python 語法
        run: python3 -m py_compile server.py

      - name: 試著啟動伺服器
        run: |
          DATA_DIR=/tmp/test-data ADMIN_PIN=test python3 server.py &
          sleep 3
          curl -fsS http://127.0.0.1:8080/api/ping
          curl -fsS http://127.0.0.1:8080/ | grep -q "無人機足球"
          curl -fsS -X POST -H "X-Admin-Pin: test" -d '{"name":"測試"}' http://127.0.0.1:8080/api/students
          curl -fsS -X POST -d '{"student_id":1,"mode":"attack","value":5,"time_limit":60}' http://127.0.0.1:8080/api/records
          echo "✅ 伺服器測試通過"

      - name: 設定多平台打包（Intel 與 ARM 的 NAS 都能用）
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登入 GitHub 映像檔倉庫
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包並上傳
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
